appId: com.vriesdemichael.opencodemobile
---
- runFlow: _setup.yaml
- tapOn: "Sessions"
- extendedWaitUntil:
          visible: "Sessions"
          timeout: 10000
- takeScreenshot: ".maestro/screenshots/session-list-loaded"
- tapOn:
          id: "create-session-button"
- extendedWaitUntil:
          visible: "No Messages Yet"
          timeout: 10000
- takeScreenshot: ".maestro/screenshots/new-session-created"
