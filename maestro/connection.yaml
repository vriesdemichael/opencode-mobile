appId: com.vriesdemichael.opencodemobile
---
- runFlow: _setup.yaml
- tapOn:
      id: "Settings_tab"
- tapOn: "Test & Save Connection"
- extendedWaitUntil:
      visible: "Success"
      timeout: 5000
- tapOn: "OK"
- assertVisible: "CONNECTED"
- takeScreenshot: ".maestro/screenshots/connection-result"
