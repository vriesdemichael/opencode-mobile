appId: com.vriesdemichael.opencodemobile
---
- launchApp:
        appId: "com.vriesdemichael.opencodemobile"
- extendedWaitUntil:
        visible: "Projects"
        timeout: 30000
- tapOn:
        id: "Settings_tab"
        optional: true
- tapOn: # Final fallback to navigate to Settings tab
        text: "Settings"
        optional: true
- assertVisible: "Connection Settings"
- tapOn: "Test & Save Connection"
- extendedWaitUntil:
        visible: "Success"
        timeout: 10000
- tapOn: "OK"
- extendedWaitUntil:
        notVisible: "Success"
        timeout: 5000
- extendedWaitUntil:
        visible: "CONNECTED"
        timeout: 5000
- pressKey: back
- tapOn: "Sessions"
- extendedWaitUntil:
        visible: "Sessions"
        timeout: 10000
- tapOn:
        id: "create-session-button"
- extendedWaitUntil:
        visible: "No Messages Yet"
        timeout: 15000
- tapOn:
        id: "chat-settings-button"
- extendedWaitUntil:
        visible: "Select AI Model"
        timeout: 10000
- tapOn:
        id: "model-option-.*"
- pressKey: back
